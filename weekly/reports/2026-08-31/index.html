        const accessKey = "weekly-report-access-2026-08-31";
        const qrToken = "11acc4f7d54e5a53ffd110ca5fb4ec37c10b";
        const url = new URL(window.location.href);
        let hasAccess = false;

        try {
          if (url.searchParams.get("access") === qrToken) {
            sessionStorage.setItem(accessKey, "granted");
            url.searchParams.delete("access");
            history.replaceState(null, "", `${url.pathname}${url.search}${url.hash}`);
            hasAccess = true;
          } else {
            hasAccess = sessionStorage.getItem(accessKey) === "granted";
          }
        } catch (error) {
          hasAccess = false;
        }

        document.documentElement.dataset.reportAccess = hasAccess ? "granted" : "locked";
        if (hasAccess) document.documentElement.classList.remove("report-locked");
      })();
