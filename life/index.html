<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      content="Wong Je 的多彩生活：收集研究之外的日常、行走与光影。"

    <meta name="theme-color" content="#f6cb74" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />

    <title>多彩生活 — Wong Je</title>

  <body>
    <header class="life-nav">
      <a class="life-brand" href="./" aria-label="多彩生活首页">
        <span>WJ</span>
        <strong>COLORFUL LIFE</strong>

    <main>
      <section class="life-hero" aria-labelledby="life-title">
        <div class="hero-copy">
          <p class="eyebrow">OFF THE CLOCK · 日常切片</p>
          <h1 id="life-title">多彩<br />生活<span>。</span></h1>

            <li>行走</li>
            <li>光影</li>
          </ul>

        <div class="color-window" aria-hidden="true">
          <span class="shape shape-sun"></span>

          <span class="shape shape-leaf"></span>

          <p>01 / LIFE ARCHIVE</p>

        <div class="coming-soon">
          <span>COMING SOON</span>
          <p>第一份生活记录正在路上。</p>
        </div>

    <footer>

      <p>© <span id="year">2026</span> Wong Je</p>

    <script>
      document.querySelector("#year").textContent = new Date().getFullYear().toString();
